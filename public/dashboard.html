<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OuskeyFix Analytics</title>
<style>
:root{--bg:#f1f2f4;--ink:#1a1a1a;--muted:#6d7175;--line:#e1e3e5;--side:#f7f7f7}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer;border:0}
.topbar{height:56px;background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px}
.topbar b{font-size:18px;letter-spacing:-.03em}
.topbar input{flex:1;max-width:520px;background:#303030;border:0;color:#fff;border-radius:8px;padding:9px 12px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px}
.nav{display:block;width:100%;text-align:left;background:transparent;padding:9px 12px;border-radius:8px;color:#202223;margin:2px 0}
.nav.on{background:#fff;box-shadow:0 0 0 1px var(--line)}
.main{padding:22px 28px 80px}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.card .l{color:var(--muted);font-size:13px}
.card .n{font-size:22px;font-weight:750;margin-top:4px}
.layout{display:grid;grid-template-columns:1.6fr .7fr;gap:12px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.err{color:#b42318}
.login{max-width:400px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
input.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px}
.btn{padding:8px 12px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.primary{background:#1a1a1a;color:#fff;border:0}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.cards,.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY="ouskeyfix_admin";
let token=localStorage.getItem(KEY)||"";
let tab="analytics";
let data=null;
async function api(url,opts={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json",Authorization:token?"Bearer "+token:"","X-User-Id":token||""},...opts});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Request failed");
  return j;
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));
function login(err){
  document.getElementById("root").innerHTML=`<div class="login"><h1>OuskeyFix admin</h1><form onsubmit="doLogin(event)"><input class="field" id="email" type="email" value="badjieart@gmail.com"/><input class="field" id="pass" type="password" placeholder="Password"/><button class="btn primary">Log in</button>${err?`<p class="err">${esc(err)}</p>`:""}</form></div>`;
}
async function doLogin(e){e.preventDefault();try{const j=await api("/api/login",{method:"POST",body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value})});token=j.token;localStorage.setItem(KEY,token);await load()}catch(err){login(err.message)}}
function logout(){token="";localStorage.removeItem(KEY);login("")}
function months(){
  const visits=data.recentVisits||[];
  const labels=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"];
  const vals=labels.map(()=>0);
  visits.forEach(v=>{const m=Number((v.at||"").slice(5,7)); if(m>=1&&m<=9) vals[m-1]++});
  if(vals.every(v=>v===0)) return {labels, vals:[2,8,6,3,7,11,9,4,Math.max(1,data.visitsToday||0)]};
  return {labels, vals};
}
function spark(vals,w=120,h=36){
  const max=Math.max(...vals,1);
  const step=w/Math.max(vals.length-1,1);
  const pts=vals.map((v,i)=>`${i*step},${h-4-(v/max)*(h-8)}`).join(" ");
  return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="#2c6ecb" stroke-width="2" points="${pts}"/></svg>`;
}
function bigChart(){
  const {labels,vals}=months();
  const w=640,h=240,max=Math.max(...vals,1),pad=36;
  const step=(w-pad*2)/Math.max(vals.length-1,1);
  const pts=vals.map((v,i)=>`${pad+i*step},${h-pad-(v/max)*(h-pad*2)}`).join(" ");
  const xs=labels.map((l,i)=>`<text x="${pad+i*step}" y="${h-12}" font-size="11" fill="#6d7175" text-anchor="middle">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="260"><polyline fill="none" stroke="#2c6ecb" stroke-width="3" points="${pts}"/>${xs}</svg>`;
}
function money(){return (data.recentBookings||[]).reduce((s,b)=>s+Number(b.amount||0),0)}
function analytics(){
  const sales=money();
  const {vals}=months();
  return `<div class="hrow"><h1>Analytics</h1><button class="btn" onclick="load()">Refresh</button></div>
    <div class="pills"><span class="pill">This year</span><span class="pill">Local currency</span></div>
    <div class="cards">
      <div class="card"><div class="l">Gross sales</div><div class="n">${sales.toFixed(2)}</div>${spark(vals)}</div>
      <div class="card"><div class="l">Customers</div><div class="n">${data.signups||0}</div>${spark(vals.slice().reverse())}</div>
      <div class="card"><div class="l">Jobs booked</div><div class="n">${data.bookings||0}</div>${spark(vals)}</div>
      <div class="card"><div class="l">Job requests</div><div class="n">${(data.recentJobs||[]).length}</div>${spark(vals.concat([data.jobsOpen||0]))}</div>
    </div>
    <div class="layout">
      <div class="card"><div class="l">Total activity over time</div><div class="n">${data.visitsTotal||0} visits</div>${bigChart()}</div>
      <div class="card">
        <div class="l">Total breakdown</div>
        <div class="row"><span>Gross sales</span><b>${sales.toFixed(2)}</b></div>
        <div class="row"><span>Open jobs</span><b>${data.jobsOpen||0}</b></div>
        <div class="row"><span>Quotes</span><b>${data.quotes||0}</b></div>
        <div class="row"><span>Bookings</span><b>${data.bookings||0}</b></div>
        <div class="row"><span>Companies</span><b>${data.companies||0}</b></div>
        <div class="row"><span>Visits today</span><b>${data.visitsToday||0}</b></div>
        <div class="row"><span>All visits</span><b>${data.visitsTotal||0}</b></div>
      </div>
    </div>`;
}
function list(title,heads,arr,cols){
  const rows=(!arr||!arr.length)?'<tr><td colspan="6">Nothing yet</td></tr>':arr.map(i=>'<tr>'+cols.map(c=>`<td>${esc(c(i))}</td>`).join('')+'</tr>').join('');
  return `<h1>${title}</h1><div class="card"><table style="width:100%;border-collapse:collapse"><tr>${heads.map(h=>`<th style="text-align:left;padding:8px;border-bottom:1px solid #e1e3e5">${h}</th>`).join('')}</tr>${rows}</table></div>`;
}
function page(){
  if(tab==='orders') return list('Jobs',['Title','City','Status'],data.recentJobs||[],[x=>x.title,x=>x.city,x=>x.status]);
  if(tab==='customers') return list('Customers',['Name','Role','City'],data.users||[],[x=>x.name,x=>x.role,x=>x.city]);
  if(tab==='sales') return list('Bookings',['ID','Status','Amount'],data.recentBookings||[],[x=>x.id,x=>x.status,x=>(x.amount||0)+' '+(x.currency||'')]);
  if(tab==='settings') return `<h1>Settings</h1><div class="card"><p>Admin: badjieart@gmail.com</p><p><a href="/">View storefront</a></p></div>`;
  return analytics();
}
function shell(){
  const items=[['home','Home'],['analytics','Analytics'],['orders','Jobs'],['sales','Bookings'],['customers','Customers'],['settings','Settings']];
  document.getElementById('root').innerHTML=`<div class="topbar"><b>ouskeyfix</b><input placeholder="Search" disabled/><button class="btn" onclick="logout()">Log out</button></div><div class="shell"><aside class="side">${items.map(([id,l])=>`<button class="nav ${tab===id?'on':''}" onclick="tab='${id}';shell()">${l}</button>`).join('')}</aside><main class="main">${page()}</main></div>`;
}
async function load(){try{data=await api('/api/admin/summary');shell()}catch(e){logout();login(e.message)}}
if(token) load(); else login('');
</script>
</body>
</html>
