<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OuskeyFix Dashboard</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#111}
.wrap{max-width:420px;margin:12vh auto;background:#fff;border:1px solid #eee;border-radius:16px;padding:24px}
input,button{font:inherit;width:100%;padding:12px;border-radius:10px;margin:8px 0}
input{border:1px solid #ddd}
button{border:0;background:#111;color:#fff;font-weight:700;cursor:pointer}
.err{color:#b91c1c}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#fff;border-bottom:1px solid #eee}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}
.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:16px}
.n{font-size:28px;font-weight:800}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px;border-bottom:1px solid #f0f0f0;font-size:14px}
.page{max-width:1100px;margin:0 auto;padding:0 20px 40px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY = "ouskeyfix_admin";
let token = localStorage.getItem(KEY) || "";
async function api(url, opts) {
  opts = opts || {};
  const r = await fetch(url, {
    headers: {
      "Content-Type": "application/json",
      Authorization: token ? "Bearer " + token : "",
      "X-User-Id": token || ""
    },
    method: opts.method || "GET",
    body: opts.body || undefined
  });
  const j = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
function login(err) {
  document.getElementById("root").innerHTML =
    '<div class="wrap"><h1>OuskeyFix admin</h1><p>Log in to see visits, jobs and bookings.</p>' +
    (err ? '<p class="err">' + err + '</p>' : '') +
    '<form id="f"><input id="email" type="email" value="badjieart@gmail.com"/>' +
    '<input id="pass" type="password" placeholder="Password"/>' +
    '<button type="submit">Log in</button></form></div>';
  document.getElementById("f").onsubmit = async function(e) {
    e.preventDefault();
    try {
      const j = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("pass").value
        })
      });
      token = j.token;
      localStorage.setItem(KEY, token);
      await load();
    } catch (ex) {
      login(ex.message);
    }
  };
}
function logout() {
  token = "";
  localStorage.removeItem(KEY);
  login("");
}
function cell(v) { return String(v == null ? "" : v).replace(/[<>&]/g, ""); }
function table(headers, rows) {
  let h = "<table><tr>" + headers.map(function(x){ return "<th>" + x + "</th>"; }).join("") + "</tr>";
  if (!rows || !rows.length) h += "<tr><td colspan='6'>Nothing yet</td></tr>";
  else rows.forEach(function(r){ h += "<tr>" + r.map(function(c){ return "<td>" + cell(c) + "</td>"; }).join("") + "</tr>"; });
  return h + "</table>";
}
async function load() {
  try {
    const d = await api("/api/admin/summary");
    const jobs = (d.recentJobs || []).map(function(x){ return [x.title, x.city, x.status]; });
    const people = (d.users || []).map(function(x){ return [x.name, x.role, x.city]; });
    const books = (d.recentBookings || []).map(function(x){ return [x.id, x.status, (x.amount || 0) + " " + (x.currency || "")]; });
    const visits = (d.recentVisits || []).map(function(x){ return [(x.at || "").replace("T"," ").slice(0,16), x.path, x.city]; });
    document.getElementById("root").innerHTML =
      '<div class="top"><b>OuskeyFix dashboard</b><span><button onclick="load()">Refresh</button> <button onclick="logout()">Log out</button></span></div>' +
      '<div class="page"><h1>Welcome ' + cell(d.adminName || "Owner") + '</h1>' +
      '<div class="grid">' +
      '<div class="card">Visits today<div class="n">' + (d.visitsToday || 0) + '</div></div>' +
      '<div class="card">Visits 7 days<div class="n">' + (d.visits7d || 0) + '</div></div>' +
      '<div class="card">Users<div class="n">' + (d.signups || 0) + '</div></div>' +
      '<div class="card">Jobs open<div class="n">' + (d.jobsOpen || 0) + '</div></div>' +
      '<div class="card">Quotes<div class="n">' + (d.quotes || 0) + '</div></div>' +
      '<div class="card">Bookings<div class="n">' + (d.bookings || 0) + '</div></div>' +
      '<div class="card">Companies<div class="n">' + (d.companies || 0) + '</div></div>' +
      '<div class="card">All visits<div class="n">' + (d.visitsTotal || 0) + '</div></div>' +
      '</div>' +
      '<div class="card"><h3>Recent visits</h3>' + table(["When","Page","City"], visits) + '</div><br/>' +
      '<div class="card"><h3>People registered</h3>' + table(["Name","Role","City"], people) + '</div><br/>' +
      '<div class="card"><h3>Jobs</h3>' + table(["Title","City","Status"], jobs) + '</div><br/>' +
      '<div class="card"><h3>Bookings</h3>' + table(["ID","Status","Amount"], books) + '</div>' +
      '<p><a href="/">Open public website</a></p></div>';
  } catch (ex) {
    logout();
    login(ex.message);
  }
}
if (token) load(); else login("");
</script>
</body>
</html>
